# conda environment for DeepFillv2 (TensorFlow 2.10.1 is the last native-Windows GPU build; on Linux any TF 2.10 build works)
name: bench-deepfillv2
channels:
  - conda-forge
dependencies:
  - python=3.9
  - cudatoolkit=11.2
  - cudnn=8.1.0
  - pip
  - pip:
    - -r requirements.txt
